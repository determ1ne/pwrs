name: Deploy documentation

on:
  push:
    branches: [dev]

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      DOCS_BRANCH: ${{ github.ref_name }}
      DOCS_COMMIT: ${{ github.sha }}
      DOCS_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build documentation
        run: |
          uv run --locked --no-default-groups --group docs python docs/generate_docs_api.py
          uv run --locked --no-default-groups --group docs sphinx-build -W --keep-going -b html -d docs/build/doctrees docs/source docs/build/html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
