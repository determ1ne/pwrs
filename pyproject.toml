[project]
name = "pwrs"
version = "0.1.3"
description = "Python package for power system simulation, ported from MATPOWER."
readme = "README.md"
authors = [
    { name = "Liangyu Zhang", email = "zhly@zju.edu.cn" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.2.0",
    "scipy>=1.14.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.4.2",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.7",
]
pyomo = [
    "pyomo>=6.9.0",
]
all = [
    "pyomo>=6.9.0",
]
klu = [
    "nbklu>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = '-m "not slow"'
markers = [
    "quick: fast regression tests intended for frequent local runs",
    "slow: long-running parity or large-case regression tests",
]
